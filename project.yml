name: PocketCoach
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"

settings:
  SWIFT_VERSION: "5.10"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:

  PocketCoach:
    type: application
    platform: iOS
    sources:
      - PocketCoach
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pocketcoach
      INFOPLIST_FILE: PocketCoach/Resources/Info.plist
    entitlements:
      path: PocketCoach/Resources/PocketCoach.entitlements
    dependencies:
      - target: PocketCoachWidget

  PocketCoachWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PocketCoachWidget
      - path: PocketCoach/Models
      - path: PocketCoach/Services/WorkoutHistoryService.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pocketcoach.widget
      INFOPLIST_FILE: PocketCoachWidget/Info.plist

  PocketCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PocketCoachTests
    dependencies:
      - target: PocketCoach
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pocketcoach.tests

schemes:
  PocketCoach:
    build:
      targets:
        PocketCoach: all
    test:
      config: Debug
      targets:
        - PocketCoachTests
